[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avangrid-hackathon"
version = "0.1.0"
description = "AMI appliance detection, load segmentation and BTM battery screening (Avangrid 2026 hackathon)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
